<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0a84ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- iOS App Icon Squircle Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />

  <!-- Stylized Film Slate / Screen Frame with Track Checkmark -->
  <g transform="translate(96, 96)">
    <!-- Movie Ticket / Card outline -->
    <rect x="0" y="0" width="320" height="320" rx="36" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="6" />

    <!-- Film Sprocket notches -->
    <rect x="28" y="24" width="28" height="20" rx="6" fill="#3f3f46" />
    <rect x="84" y="24" width="28" height="20" rx="6" fill="#3f3f46" />
    <rect x="140" y="24" width="28" height="20" rx="6" fill="#3f3f46" />
    <rect x="196" y="24" width="28" height="20" rx="6" fill="#3f3f46" />
    <rect x="252" y="24" width="28" height="20" rx="6" fill="#3f3f46" />

    <rect x="28" y="276" width="28" height="20" rx="6" fill="#3f3f46" />
    <rect x="84" y="276" width="28" height="20" rx="6" fill="#3f3f46" />
    <rect x="140" y="276" width="28" height="20" rx="6" fill="#3f3f46" />
    <rect x="196" y="276" width="28" height="20" rx="6" fill="#3f3f46" />
    <rect x="252" y="276" width="28" height="20" rx="6" fill="#3f3f46" />

    <!-- Center Play / Track Checkmark icon in neon blue -->
    <path d="M96 160 L144 204 L232 116" fill="none" stroke="url(#accent-grad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
    <!-- Floating Tracker indicator dot -->
    <circle cx="230" cy="118" r="8" fill="#ffffff" />
  </g>
</svg>

